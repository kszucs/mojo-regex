[workspace]
authors = ["Manuel Saelices <msaelices@gmail.com>"]
channels = [
  "https://conda.modular.com/max-nightly/",
  "conda-forge",
  "https://prefix.dev/pixi-build-backends",
]
description = "Library for dealing with regular expressions in Mojo"
homepage = "https://github.com/msaelices/mojo-regex"
repository = "https://github.com/msaelices/mojo-regex"
license = "MIT"
license-file = "LICENSE"
name = "mojo-regex"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.21.0"

[package]
name = "mojo-regex"
version = "0.21.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.2.*" }

# Installs $PREFIX/lib/mojo/regex.mojoc (or .mojopkg on a Mojo without
# `precompile`), which Mojo resolves with no `-I`.
[package.build.config]
pkg = { name = "regex", path = "src/regex" }

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026102505"
mojo = "==1.3.0.dev2026102505"

[dependencies]
mojo = "==1.3.0.dev2026102505"

[tasks]
test = "bash -c 'status=0; for f in tests/test_*.mojo; do echo \"Running $f...\"; out=$(mktemp -d); mojo build -I ./src -debug-level=line-tables \"$f\" -o \"$out/exe\" && \"$out/exe\" || status=1; rm -rf \"$out\"; done; exit $status'"
format = "mojo format benchmarks/ src/regex/ tests/"

[feature.mojopkg.dependencies]
pyyaml = ">=6.0.2,<7"

[environments]
default = { solve-group = "default" }
mojopkg = { features = ["mojopkg"], solve-group = "default" }
